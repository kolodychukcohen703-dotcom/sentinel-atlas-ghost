<!DOCTYPE html>
<html><head><title>Sentinel Atlas — Living World</title><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/atlas-nav.css"></head>
<body>
<div id="top"><b>✦ SENTINEL ATLAS + GHOST HUB</b><span>Living World • City Simulation • Collaboration Network</span><nav class="atlas-nav"><a class="active" href="/">🌍 Living World</a><a href="/kelowna/">⌖ Kelowna Command Atlas</a><a href="/kelowna/kiosk">◉ Kiosk</a><a href="http://127.0.0.1:5011/" target="_blank" rel="noopener">👻 Ghost Collaboration</a></nav></div>
<div id="wrap">
<aside id="left">
<section class="panel"><h3>🌍 World Forge</h3><button onclick="SentinelUI.startWorld('beginner')">Beginner</button><button onclick="SentinelUI.startWorld('medium')">Medium</button><button onclick="SentinelUI.startWorld('advanced')">Advanced</button><button onclick="SentinelUI.listWorlds()">Star Chart Worlds</button><div id="forge"></div></section>
<section class="panel"><h3>🏠 Home Forge</h3><button onclick="SentinelUI.startHome('beginner')">Beginner</button><button onclick="SentinelUI.startHome('medium')">Medium</button><button onclick="SentinelUI.startHome('advanced')">Advanced</button><div id="homeforge"></div></section>
<section class="panel"><h3>🎨 Decorator Forge</h3><button onclick="SentinelUI.startDecorator('beginner')">Beginner</button><button onclick="SentinelUI.startDecorator('medium')">Medium</button><button onclick="SentinelUI.startDecorator('advanced')">Advanced</button><div id="decorforge"></div></section>
<section class="panel"><h3>🎥 Views</h3><button onclick="SentinelWorld.setMode('stars')">3D Star Chart</button><button onclick="SentinelWorld.setMode('planet')">Planet View</button><button onclick="SentinelWorld.setMode('bird')">Bird Grid</button><button onclick="SentinelWorld.setMode('city')">City View</button><button onclick="SentinelWorld.setMode('street')">Street View</button><button onclick="SentinelWorld.zoom(-2)">Zoom In</button><button onclick="SentinelWorld.zoom(2)">Zoom Out</button><button onclick="SentinelWorld.enterInterior()">Interior</button><button onclick="SentinelWorld.exitInterior()">Exit Interior</button></section>
</aside>
<main id="main"><div id="hud">Load a world or open 3D Star Chart.</div><div id="streetControls"><button onclick="SentinelWorld.walk(0,-1)">⬆</button><br><button onclick="SentinelWorld.walk(-1,0)">⬅</button><button onclick="SentinelWorld.walk(1,0)">➡</button><br><button onclick="SentinelWorld.walk(0,1)">⬇</button></div><div id="world3d"></div><div id="toolbar"><b>Tools</b><button onclick="SentinelWorld.setTool('residential_zone')">Residential</button><button onclick="SentinelWorld.setTool('commercial_zone')">Commercial</button><button onclick="SentinelWorld.setTool('industrial_zone')">Industry</button><button onclick="SentinelWorld.setTool('road')">Road</button><button onclick="SentinelWorld.setTool('rail')">Rail</button><button onclick="SentinelWorld.setTool('powerline')">Power</button><button onclick="SentinelWorld.setTool('trail')">Trail</button><button onclick="SentinelWorld.setTool('path')">Path</button><button onclick="SentinelWorld.setTool('home')">Home</button><button onclick="SentinelWorld.setTool('shop')">Shop</button><button onclick="SentinelWorld.setTool('tree')">Tree</button><button onclick="SentinelWorld.setTool('lake')">Lake</button><button onclick="SentinelWorld.simulateMonth()">Grow 1 Month</button><button onclick="SentinelWorld.simulateYear()">Grow 1 Year</button><button onclick="SentinelWorld.undoBuild()">Undo</button><button onclick="SentinelWorld.clearBuilds()">Clear</button></div></main>
<aside id="chat"><h3>💬 Sentinel Chat</h3><div id="messages"></div><input id="chatInput" placeholder="Type !stars, !planet, !help..." onkeydown="if(event.key==='Enter')SentinelUI.sendChat()"><button onclick="SentinelUI.sendChat()">Send</button></aside>
</div><script type="module" src="/static/js/app.js"></script></body></html>
